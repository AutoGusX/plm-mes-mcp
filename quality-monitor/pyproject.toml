[project]
name = "quality-monitor"
version = "0.1.0"
description = "Webhook receiver and quality alert agent for Fusion Operations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.40.0",
    "mcp[cli]>=1.26.0",
    "pywin32>=311",
    "paho-mqtt>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
