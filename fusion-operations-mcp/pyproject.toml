[project]
name = "fusion-operations-mcp"
version = "0.1.0"
description = "MCP server for Autodesk Fusion Operations (MES)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.41.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
fusion-operations-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
